# コードをGitHubに保存するたびに、ネット上のMacで「ちゃんと組み立てられるか」を自動チェックします。
# Apple Developer Programの登録がなくても動きます（署名なし・シミュレーター向け）。
name: Build Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Appleチップ(arm64)のMacが混雑して始まらないことがあるため、Intel版を使う
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project MyHealthAI.xcodeproj \
            -scheme MyHealthAI \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
